<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Envío - Checkout NextFeet</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Next<span>Feet</span></a>
    </nav>

    <div class="container">
        <div class="steps">
            <div class="step active"><span class="step-number">1</span> Envío</div>
            <div class="step"><span class="step-number">2</span> Pago</div>
            <div class="step"><span class="step-number">3</span> Confirmación</div>
        </div>

        <h1 class="page-title">Dirección de Envío</h1>

        <div class="form-container" style="max-width:600px;">
            <form action="checkoutpago.html" method="GET">
                <div class="form-group">
                    <label for="ciudad">Ciudad</label>
                    <input type="text" id="ciudad" name="ciudad" placeholder="Lima" required>
                </div>

                <div class="form-group">
                    <label for="distrito">Distrito</label>
                    <input type="text" id="distrito" name="distrito" placeholder="Miraflores" required>
                </div>

                <div class="form-group">
                    <label for="direccion">Dirección exacta</label>
                    <input type="text" id="direccion" name="direccion" 
                           placeholder="Av. Larco 123, Dpto 401" required>
                </div>

                <div class="form-group">
                    <label for="referencias">Referencias</label>
                    <textarea id="referencias" name="referencias" rows="3" 
                              placeholder="Frente al parque, edificio azul..."></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Confirmar y continuar al pago →
                </button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-bottom" style="max-width:1200px;margin:0 auto;text-align:center;">
            © 2026 NextFeet
        </div>
    </footer>
</body>
</html>
