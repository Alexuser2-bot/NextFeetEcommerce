<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Next<span>Feet</span></a>
        <ul class="nav-links">
            <li><a href="index.html">Inicio</a></li>
            <li><a href="catalogo.html">Catálogo</a></li>

            <li><a href="contacto.html" class="active">Contacto</a></li>
        </ul>
        <div class="nav-icons">
            <a href="perfil.html">👤</a>
            <a href="carrito.html">🛒<span class="cart-badge">3</span></a>
        </div>
    </nav>

    <div class="container">
        <h1 class="page-title">Contáctanos</h1>

        <div class="form-container" style="max-width:600px;">
            <p style="color:var(--gray); margin-bottom:2rem; text-align:center;">
                ¿Tienes alguna consulta? Completa el formulario y te responderemos a la brevedad.
            </p>

            <form>
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" required>
                </div>

                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" required>
                </div>

                <div class="form-group">
                    <label for="asunto">Asunto</label>
                    <input type="text" id="asunto" required>
                </div>

                <div class="form-group">
                    <label for="mensaje">Mensaje</label>
                    <textarea id="mensaje" rows="5" required></textarea>
                </div>

                <button type="submit" class="btn btn-primary btn-block">Enviar mensaje</button>
            </form>

            <hr style="margin:2rem 0; border:none; border-top:1px solid var(--border);">

            <h3>Información de contacto</h3>
            <p style="margin-top:1rem; color:var(--gray); font-size:0.9rem;">
                📧 contacto@nextfeet.pe<br>
                📞 +51 987 654 321<br>
                📍 Av. Universitaria 1234, Lima, Perú
            </p>
        </div>
    </div>

    <footer>
        <div class="footer-bottom" style="max-width:1200px;margin:0 auto;text-align:center;">
            © 2026 NextFeet
        </div>
    </footer>
</body>
</html>
