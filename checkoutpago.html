<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pago - Checkout NextFeet</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .payment-options {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin: 1rem 0 1.5rem;
        }
        .payment-option {
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 1rem;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s;
        }
        .payment-option:hover,
        .payment-option.selected {
            border-color: var(--accent);
            background: #fff5f7;
        }
        .payment-option .icon { font-size: 2rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="logo">Next<span>Feet</span></a>
    </nav>

    <div class="container">
        <div class="steps">
            <div class="step"><span class="step-number">✓</span> Envío</div>
            <div class="step active"><span class="step-number">2</span> Pago</div>
            <div class="step"><span class="step-number">3</span> Confirmación</div>
        </div>

        <h1 class="page-title">Método de Pago</h1>

        <div class="form-container" style="max-width:600px;">
            <form action="comprobante.html" method="GET">
                <label>Selecciona tu método de pago:</label>
                <div class="payment-options">
                    <div class="payment-option selected">
                        <div class="icon">💳</div>
                        <div>Tarjeta</div>
                    </div>
                    <div class="payment-option">
                        <div class="icon">📱</div>
                        <div>Yape / Plin</div>
                    </div>
                    <div class="payment-option">
                        <div class="icon">🏦</div>
                        <div>Transferencia</div>
                    </div>
                </div>

                <div class="form-group">
                    <label for="card-number">Número de tarjeta</label>
                    <input type="text" id="card-number" placeholder="1234 5678 9012 3456" 
                           maxlength="19" required>
                </div>

                <div class="form-group">
                    <label for="card-name">Nombre del titular</label>
                    <input type="text" id="card-name" placeholder="Como aparece en la tarjeta" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="exp">Fecha de expiración</label>
                        <input type="text" id="exp" placeholder="MM/AA" maxlength="5" required>
                    </div>
                    <div class="form-group">
                        <label for="cvv">CVV</label>
                        <input type="text" id="cvv" placeholder="123" maxlength="4" required>
                    </div>
                </div>

                <div class="cart-summary" style="max-width:100%; margin:1.5rem 0;">
                    <div class="summary-row">
                        <span>Subtotal</span>
                        <span>S/ 1037.00</span>
                    </div>
                    <div class="summary-row">
                        <span>Envío</span>
                        <span>Gratis</span>
                    </div>
                    <div class="summary-row total">
                        <span>Total</span>
                        <span>S/ 1037.00</span>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                     Pagar ahora
                </button>
            </form>
        </div>
    </div>

    <footer>
        <div class="footer-bottom" style="max-width:1200px;margin:0 auto;text-align:center;">
            © 2026 NextFeet
        </div>
    </footer>
</body>
</html>
